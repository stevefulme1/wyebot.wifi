---
# defaults file for wyebot.wifi.sensor_monitor

# Wyebot Cloud API key for authentication
wyebot_api_key: ""

# Wyebot Cloud API base URL
wyebot_api_url: "https://cloud.wyebot.com/api/v1"

# Monitoring interval in seconds between health checks
wyebot_monitor_interval: 300

# Health score threshold (0-100); sensors scoring below this are flagged
wyebot_health_threshold: 70

# Email address to receive alerts when sensors are unhealthy (empty = no alerts)
wyebot_alert_email: ""

# Directory for health check log files
wyebot_monitor_log_path: "/var/log/wyebot"
