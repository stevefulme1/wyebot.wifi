---
# defaults file for wyebot.wifi.prometheus_exporter

# Container image for the Wyebot Prometheus exporter
wyebot_prometheus_image: "wyebotexporter/prometheus:latest"

# Host port to expose the exporter metrics endpoint
wyebot_prometheus_port: 8014

# Wyebot Cloud API key for authentication
wyebot_prometheus_api_key: ""

# Wyebot Cloud API base URL
wyebot_prometheus_api_url: "https://cloud.wyebot.com/api/v1"

# Name of the Docker container
wyebot_prometheus_container_name: "wyebot-prometheus-exporter"

# Container restart policy (always, on-failure, unless-stopped, no)
wyebot_prometheus_restart_policy: "always"
