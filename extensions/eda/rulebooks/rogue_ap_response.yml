- name: Wyebot Rogue AP Response
  hosts: all
  sources:
    - wyebot.wifi.wyebot_events:
        api_key: "{{ WYEBOT_API_KEY }}"
        poll_interval: 30

  rules:
    - name: Investigate and notify on rogue AP detection
      condition: >-
        event.wyebot.event_type == "alert" and
        event.wyebot.alert.category == "rogue_ap"
      action:
        run_job_template:
          name: "Wyebot Rogue AP Investigation"
          organization: Default
          job_args:
            extra_vars:
              alert_id: "{{ event.wyebot.alert.id }}"
              rogue_bssid: "{{ event.wyebot.alert.bssid | default('unknown') }}"
              rogue_ssid: "{{ event.wyebot.alert.ssid | default('unknown') }}"
              sensor_id: "{{ event.wyebot.sensor_id }}"
              location_id: "{{ event.wyebot.location_id }}"
              severity: "{{ event.wyebot.alert.severity | default('warning') }}"
              alert_details: "{{ event.wyebot.alert }}"
