[tool.black]
line-length = 100

[tool.pytest.ini_options]
addopts = ["-vvv", "-n", "2", "--log-level", "WARNING", "--color", "yes"]
filterwarnings = ["ignore:AnsibleCollectionFinder has already been configured"]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 100
ignore = ["E501", "W503"]

[tool.pylint."messages control"]
max-line-length = 100

[tool.coverage.run]
source = ["plugins"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
